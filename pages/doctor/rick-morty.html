<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personajes Rick & Morty - Sistema Médico</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Estilos específicos para las tarjetas de personajes */
        .character-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
        }
        .character-card {
            background-color: var(--bg-secondary);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }
        .character-card:hover {
            transform: translateY(-5px);
        }
        .character-card img {
            border-radius: 50%;
            width: 120px;
            height: 120px;
            object-fit: cover;
            border: 3px solid #7289da;
        }
        .character-card h3 {
            margin: 10px 0 5px;
        }
        .character-card p {
            margin: 0;
            font-size: 0.9em;
            color: var(--text-secondary);
        }
        .error-message {
            color: var(--error-color);
            font-size: 1.2em;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i class="fas fa-stethoscope"></i>
                </div>
                <div>
                    <div class="sidebar-title">Sistema Médico</div>
                    <div class="sidebar-subtitle">Integral</div>
                </div>
            </div>

            <nav>
                <ul class="sidebar-nav">
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link">
                            <i class="fas fa-home"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">
                            <i class="fas fa-users"></i>
                            <span>Pacientes</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">
                            <i class="fas fa-calendar-alt"></i>
                            <span>Agenda</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">
                            <i class="fas fa-file-alt"></i>
                            <span>Historia Clínica</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">
                            <i class="fas fa-microscope"></i>
                            <span>Estudios</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">
                            <i class="fas fa-hospital-alt"></i>
                            <span>Especialidades</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="rick-morty.html" class="nav-link active">
                            <i class="fas fa-flask"></i>
                            <span>API Rick & Morty</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div style="margin-top: auto; padding-top: 2rem; border-top: 1px solid var(--border-color);">
                <div class="nav-link">
                    <div style="display: flex; align-items: center; gap: 0.75rem;">
                        <div style="width: 32px; height: 32px; background: var(--bg-tertiary); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                            <i class="fas fa-user-shield"></i>
                        </div>
                        <div>
                            <div style="font-weight: 500; font-size: 0.875rem;">Admin Sistema</div>
                            <div style="font-size: 0.75rem; color: var(--text-secondary);">ADM001</div>
                        </div>
                    </div>
                </div>
                <div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; font-size: 0.75rem; color: var(--text-secondary);">
                    <div class="status-dot green"></div>
                    <span>Sistema Operativo</span>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Integración API: Rick and Morty</h1>
                    <p class="page-subtitle">Consumo de API pública para visualizar personajes.</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-sm btn-outline" style="margin-right: 1rem;">
                        <i class="fas fa-sync-alt"></i>
                        Recargar Datos
                    </button>
                </div>
            </div>

            <div id="character-container" class="character-container">
                </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/dashboard.js"></script>
</body>
</html>
